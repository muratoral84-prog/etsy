# Kartviziti GitHub Pages üzerinde yayınlar.
# Depo ayarlarında: Settings → Pages → Source: "GitHub Actions" seçilmelidir.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testleri çalıştır
        run: node tools/testler.mjs
      - name: Üretilen dosyalar güncel mi
        run: |
          node tools/uret.mjs
          # kartvizit.vcf içindeki REV alanı her üretimde değişir, karşılaştırmadan çıkarılır
          git diff --exit-code -- assets/qr-kartvizit.svg
          git diff --stat -- kartvizit.vcf
          node tools/tisort-uret.mjs
          git diff --exit-code -- urun/tisort/tasarim

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
